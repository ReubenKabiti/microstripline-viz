[package]
name = "microstrip-lab"
version = "0.1.0"
description = "Microstrip line visualizer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 4
lto = true
opt-level = "s"
panic = "abort"
strip = true
